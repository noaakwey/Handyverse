<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>🚀 Солнечная система для малышей</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>" />
  <meta name="description" content="Интерактивное 3D-путешествие по Солнечной системе для детей. Планеты, Солнце и весёлые факты на русском языке." />
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Three.js подключается локально (папка vendor) — интернет не нужен -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <!-- Экран загрузки -->
  <div id="loader">
    <div class="rocket">🚀</div>
    <div class="loader-text">Готовим ракету…</div>
  </div>

  <!-- 3D-сцена -->
  <canvas id="scene"></canvas>

  <!-- Подписи к планетам (рисуются поверх 3D) -->
  <div id="labels"></div>

  <!-- Верхняя панель управления -->
  <header id="topbar">
    <button id="btn-home" class="ctrl-btn" title="Показать всю систему" aria-label="Вся система">
      <span class="ico">🏠</span><span class="lbl">Вся система</span>
    </button>
    <button id="btn-play" class="ctrl-btn" title="Пауза / Движение" aria-label="Пауза или движение">
      <span class="ico">⏸️</span><span class="lbl">Пауза</span>
    </button>
    <button id="btn-tour" class="ctrl-btn" title="Путешествие по планетам" aria-label="Путешествие">
      <span class="ico">🎬</span><span class="lbl">Путешествие</span>
    </button>
    <button id="btn-events" class="ctrl-btn" title="Космические явления" aria-label="Явления">
      <span class="ico">🌗</span><span class="lbl">Явления</span>
    </button>
    <button id="btn-mission" class="ctrl-btn" title="Миссия для Эрика" aria-label="Миссия">
      <span class="ico">⭐</span><span class="lbl">Миссия</span>
    </button>
    <button id="btn-sound" class="ctrl-btn" title="Звук" aria-label="Звук">
      <span class="ico">🔊</span><span class="lbl">Звук</span>
    </button>

    <div class="speed-box">
      <span class="ico">🐢</span>
      <input id="speed" type="range" min="0" max="100" value="45" aria-label="Скорость планет" />
      <span class="ico">🐇</span>
    </div>
  </header>

  <aside id="mission-panel" class="hidden" aria-live="polite">
    <div class="mission-head">
      <span>⭐ Миссия Эрика</span>
      <b id="star-score">0</b>
    </div>
    <div id="mission-card" class="mission-card" aria-hidden="true">
      <span id="mission-emoji">🚀</span>
      <b id="mission-name">Космос</b>
    </div>
    <p id="mission-text">Выбери миссию и собери звёзды!</p>
    <div class="mission-actions">
      <button id="mission-repeat" class="say-btn small">🔊 Повторить</button>
      <button id="mission-show" class="say-btn small">🚀 Показать</button>
      <button id="mission-next" class="say-btn small">🎲 Новая</button>
    </div>
  </aside>

  <div id="toast" class="hidden" aria-live="polite"></div>

  <!-- Карточка-подсказка: для 4-летнего ребёнка главное звук, жесты и крупные кнопки -->
  <section id="card" class="hidden" aria-live="polite">
    <button id="card-close" aria-label="Закрыть">✕</button>
    <div id="card-emoji">🪐</div>
    <h2 id="card-title">Планета</h2>
    <p id="card-fact">Нажми 🔊 и слушай подсказку</p>
    <div id="card-stats"></div>
    <div id="card-action" class="card-action"></div>
    <div id="quiz-box" class="quiz-box"></div>
    <button id="card-say" class="say-btn">🔊 Рассказать ещё раз</button>
  </section>

  <!-- Меню космических явлений -->
  <div id="events-menu" class="hidden" role="menu" aria-label="Космические явления"></div>

  <!-- Панель режима явления (затмения, фазы Луны) -->
  <section id="demo-bar" class="hidden">
    <button id="demo-back" aria-label="Назад в космос">⬅️ В космос</button>
    <div class="demo-text">
      <span id="demo-title">Явление</span>
      <span id="demo-phase"></span>
    </div>
    <button id="demo-say" class="say-btn small" aria-label="Повторить">🔊</button>
  </section>

  <!-- Нижнее меню планет -->
  <nav id="planet-bar" aria-label="Выбор планеты"></nav>

  <!-- Стикер-посвящение -->
  <div id="dedication" aria-hidden="true">Эрику с <span class="heart">❤️</span> от папы</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
