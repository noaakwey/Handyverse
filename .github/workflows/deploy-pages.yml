name: Deploy to GitHub Pages

# Публикуем сайт при пуше в рабочую ветку, а также позволяем
# запускать деплой вручную через вкладку Actions.
on:
  push:
    branches:
      - main
      - master
      - claude/3d-solar-system-kids-0ros1v
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем только один деплой одновременно.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Автоматически включаем GitHub Pages, если они ещё не включены,
          # чтобы не настраивать вручную в Settings.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # Сайт — это весь репозиторий (статические файлы в корне).
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
